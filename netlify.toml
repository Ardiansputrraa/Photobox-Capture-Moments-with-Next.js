# netlify.toml
# ─────────────────────────────────────────────────────────────────────────────
# Netlify deployment configuration for PhotoBox (Next.js static export).
# The app is built with `output: "export"` so it generates a plain static
# site — no server required.

[build]
  command   = "npm run build"
  publish   = "out"

# Ensure all routes work (SPA-style fallback).
# Next.js static export with trailingSlash creates /photobox/index.html etc,
# so most routes resolve directly. This catch-all is a safety net.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
